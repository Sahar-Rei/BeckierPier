<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>BeckiePier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+SC:wght@500;700&family=UnifrakturCook:wght@700&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          oak: { DEFAULT: '#4a2e1b', dark: '#2b1810', bog: '#1a0f0a' },
          parch: '#e8d8b0',
          bronze: '#c5a059',
          candle: '#ffaa33',
          steel: '#708090'
        }
      }
    }
  };
</script>
<style>
  /* Layout: a half-timbered street at dusk. A rain-lashed hero (Excalibur in its stone between two
     timber houses), then wooden signs and framed cards laid on a cobblestone street, a timber-framed
     statute wall, and a torch-lit footer. One deliberate bold moment: the sword's slow pulse. */
  :root {
    --oak-dark: #2b1810;
    --oak: #4a2e1b;
    --bog: #1a0f0a;
    --ink: #0d0705;
    --parch: #e8d8b0;
    --bronze: #c5a059;
    --candle: #ffaa33;
    --steel: #708090;
    --steel-lt: #a9b6c2;
    --ground: #26221f;
    --f-display: 'UnifrakturCook', 'Old English Text MT', Georgia, serif;
    --f-body: 'Alegreya', Georgia, 'Times New Roman', serif;
    --f-caps: 'Alegreya SC', Georgia, 'Times New Roman', serif;
    color-scheme: dark;
  }

  html { scroll-behavior: smooth; scroll-padding-top: 72px; background: var(--ground); }
  html, body { overflow-x: clip; }
  body {
    background-color: var(--ground);
    background-image: var(--cobble, none);
    background-size: 520px 520px;
    color: var(--parch);
    font-family: var(--f-body);
    font-size: 18px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  /* dusk vignette over the cobblestones */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(26,15,10,.1), rgba(10,6,4,.72) 100%),
      linear-gradient(rgba(26,15,10,.4), rgba(26,15,10,.4));
  }
  #root { position: relative; z-index: 1; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--candle); outline-offset: 3px; }

  .g {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 1160px; margin: 0 auto; }

  /* ---------- nav ---------- */
  .nav {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
    background: linear-gradient(180deg, #34200f, #1f120b);
    border-bottom: 3px solid var(--ink);
    box-shadow: 0 1px 0 rgba(197,160,89,.35), 0 10px 22px rgba(0,0,0,.55);
  }
  .nav-in { max-width: 1160px; margin: 0 auto; display: flex; align-items: center; gap: 26px; height: 56px; }
  .nav-logo { font-family: var(--f-display); font-size: 1.9rem; text-decoration: none; color: var(--parch); line-height: 1; text-shadow: 0 0 14px rgba(255,170,51,.3); }
  .nav-links { gap: 22px; font-family: var(--f-caps); letter-spacing: .12em; font-size: .95rem; }
  .nav-links a { text-decoration: none; color: var(--bronze); padding: 4px 0; border-bottom: 1px solid transparent; transition: color .2s, border-color .2s; }
  .nav-links a:hover { color: var(--parch); border-bottom-color: var(--bronze); }
  .chest-btn {
    font-family: var(--f-caps); letter-spacing: .1em; font-size: .95rem; color: var(--parch);
    background: rgba(26,15,10,.7); border: 1px solid rgba(197,160,89,.55); border-radius: 3px;
    padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    transition: box-shadow .25s, border-color .25s;
  }
  .chest-btn:hover { border-color: var(--bronze); box-shadow: 0 0 14px rgba(255,170,51,.35); }
  .count { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; background: var(--bronze); color: var(--bog); font-weight: 700; font-size: .85rem; }
  .chest-panel {
    position: absolute; top: calc(100% + 8px); right: max(16px, env(safe-area-inset-right, 0px));
    width: min(360px, calc(100vw - 32px)); padding: 18px 18px 14px;
    background: linear-gradient(180deg, #3a2314, #24140c);
    border: 2px solid var(--ink); border-radius: 4px;
    box-shadow: inset 0 0 0 1px rgba(197,160,89,.4), 0 18px 34px rgba(0,0,0,.65);
  }
  .chest-panel h2 { font-family: var(--f-caps); letter-spacing: .12em; color: var(--bronze); font-size: 1rem; margin: 0 0 10px; }
  .chest-panel ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .chest-panel li { display: flex; align-items: baseline; gap: 10px; border-bottom: 1px dashed rgba(197,160,89,.3); padding-bottom: 6px; }
  .chest-panel li span:first-child { flex: 1; min-width: 0; }
  .chest-panel .rm { background: none; border: 0; color: var(--steel-lt); cursor: pointer; font: inherit; text-decoration: underline; padding: 0 2px; }
  .chest-panel .total { display: flex; justify-content: space-between; margin-top: 12px; font-family: var(--f-caps); letter-spacing: .08em; color: var(--bronze); font-size: 1.1rem; }
  .chest-panel .note { margin: 8px 0 0; font-size: .9rem; color: rgba(232,216,176,.7); font-style: italic; }

  /* ---------- hero ---------- */
  .hero { position: relative; overflow: hidden; isolation: isolate; background: #17181a; }
  .clouds { position: absolute; inset: 0; z-index: 0; background: linear-gradient(180deg, #0e0f11 0%, #212428 42%, #34312e 78%, #3a3430 100%); overflow: hidden; }
  .cloud { position: absolute; left: -25%; width: 150%; filter: blur(18px); will-change: transform; animation: drift var(--dur, 48s) ease-in-out infinite alternate; }
  .cloud.c1 { top: -10%; height: 56%; --dur: 46s;
    background:
      radial-gradient(ellipse 22% 55% at 10% 45%, rgba(74,78,84,.95), transparent 70%),
      radial-gradient(ellipse 26% 60% at 34% 35%, rgba(52,55,60,.98), transparent 70%),
      radial-gradient(ellipse 24% 55% at 60% 50%, rgba(68,72,78,.92), transparent 70%),
      radial-gradient(ellipse 22% 58% at 88% 40%, rgba(46,49,54,.98), transparent 70%); }
  .cloud.c2 { top: 12%; height: 46%; --dur: 64s; animation-direction: alternate-reverse;
    background:
      radial-gradient(ellipse 20% 55% at 18% 50%, rgba(40,43,48,.95), transparent 70%),
      radial-gradient(ellipse 24% 60% at 46% 42%, rgba(58,61,67,.9), transparent 70%),
      radial-gradient(ellipse 22% 55% at 74% 52%, rgba(38,41,46,.95), transparent 70%); }
  .cloud.c3 { top: 34%; height: 38%; --dur: 80s; opacity: .8;
    background:
      radial-gradient(ellipse 24% 50% at 22% 50%, rgba(92,84,76,.55), transparent 70%),
      radial-gradient(ellipse 26% 55% at 58% 45%, rgba(84,78,72,.5), transparent 70%),
      radial-gradient(ellipse 20% 50% at 90% 55%, rgba(96,86,76,.5), transparent 70%); }
  @keyframes drift { from { transform: translate3d(-6%, 0, 0); } to { transform: translate3d(6%, 14px, 0); } }

  .house { position: absolute; bottom: 24px; z-index: 1; opacity: .97; pointer-events: none; }
  .house svg { display: block; width: 100%; height: auto; }
  .house-l { left: -2%; width: clamp(150px, 24vw, 280px); }
  .house-r { right: -3%; width: clamp(130px, 19vw, 220px); transform: scaleX(-1); }
  .win { animation: winflick 3.8s ease-in-out infinite; }
  .win.w2 { animation-delay: -1.3s; }
  .win.w3 { animation-delay: -2.4s; }
  @keyframes winflick { 0%, 100% { opacity: .78; } 30% { opacity: 1; } 55% { opacity: .86; } 78% { opacity: .97; } }

  .rain { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }

  .hero-inner { position: relative; z-index: 2; text-align: center; padding-top: 34px; padding-bottom: 58px; }
  .logo {
    margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(3.8rem, 13.5vw, 8.6rem); line-height: .98;
    color: var(--parch); letter-spacing: .01em;
    text-shadow: 0 3px 0 #1a0f0a, 0 0 26px rgba(255,170,51,.34), 0 0 3px rgba(0,0,0,.9);
  }
  .tag { margin: 10px 0 0; font-family: var(--f-caps); font-weight: 500; letter-spacing: .2em; font-size: clamp(.85rem, 2.7vw, 1.2rem); color: var(--bronze); text-shadow: 0 1px 6px rgba(0,0,0,.8); }
  .sub { margin: 6px auto 0; max-width: 34ch; font-style: italic; color: rgba(232,216,176,.82); text-shadow: 0 1px 8px rgba(0,0,0,.9); text-wrap: balance; }
  .scene { position: relative; width: min(580px, 100%); margin: 6px auto 0; }
  .scene svg { display: block; width: 100%; height: auto; }
  .cta-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 8px; }
  .hero-beam {
    position: absolute; left: 0; right: 0; bottom: 0; height: 26px; z-index: 3;
    background:
      radial-gradient(circle at 50% 50%, #e8c98a 0 2px, #6b4e1f 3px, transparent 4.5px) 0 50% / 96px 100% repeat-x,
      repeating-linear-gradient(90deg, rgba(0,0,0,0) 0 9px, rgba(0,0,0,.16) 9px 10px, rgba(255,200,140,.04) 10px 16px),
      linear-gradient(180deg, #5b3a22, #3a2314 60%, #2b1810);
    border-top: 3px solid var(--ink);
    box-shadow: 0 -12px 22px rgba(0,0,0,.5);
  }

  /* the sword and its stone */
  .sword { animation: swordPulse 6s ease-in-out infinite; }
  .aura { animation: aura 6s ease-in-out infinite; transform-origin: 300px 260px; }
  .shimmer { animation: shimmer 6s ease-in-out infinite; }
  .runes { animation: runeGlow 6s ease-in-out infinite; }
  @keyframes swordPulse { 0%, 100% { filter: drop-shadow(0 0 2px rgba(255,200,120,.12)); } 46%, 54% { filter: drop-shadow(0 0 14px rgba(255,190,100,.8)); } }
  @keyframes aura { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  @keyframes shimmer {
    0% { transform: translateY(290px); opacity: 0; }
    20% { opacity: 1; }
    50% { transform: translateY(0); opacity: 1; }
    62% { transform: translateY(-14px); opacity: 0; }
    100% { transform: translateY(-14px); opacity: 0; }
  }
  @keyframes runeGlow { 0%, 100% { stroke: #2b3138; } 50% { stroke: #ffc566; } }

  /* ---------- buttons ---------- */
  .btn {
    font-family: var(--f-caps); font-weight: 700; letter-spacing: .08em; font-size: 1rem; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    color: var(--bog); cursor: pointer;
    background: linear-gradient(180deg, #e6c985, #c5a059 52%, #9c7a3a);
    border: 2px solid var(--oak-dark); border-radius: 3px; padding: 10px 20px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 2px 0 var(--ink), 0 0 0 1px rgba(197,160,89,.4);
    transition: filter .2s, box-shadow .25s, transform .1s;
  }
  .btn:hover { filter: brightness(1.1); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 2px 0 var(--ink), 0 0 20px rgba(255,170,51,.55); }
  .btn:active { transform: translateY(1px); }
  .btn.ghost { background: rgba(26,15,10,.55); color: var(--parch); border-color: rgba(197,160,89,.6); box-shadow: inset 0 0 0 1px rgba(26,15,10,.8); }
  .btn.ghost:hover { box-shadow: 0 0 16px rgba(255,170,51,.35); filter: none; }
  .btn[aria-pressed="true"] { background: rgba(26,15,10,.6); color: var(--bronze); border-color: var(--bronze); box-shadow: inset 0 0 0 1px rgba(26,15,10,.9); }

  /* ---------- plaque / headings ---------- */
  .plaque {
    position: relative; margin: 0 auto; max-width: 780px; text-align: center; border-radius: 4px;
    padding: 30px clamp(22px, 5vw, 54px);
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,0) 0 7px, rgba(0,0,0,.13) 7px 8px, rgba(255,200,140,.035) 8px 13px),
      linear-gradient(180deg, #5b3a22, #3a2314 55%, #2b1810);
    box-shadow: inset 0 1px 0 rgba(255,214,160,.25), inset 0 0 0 3px var(--bog), inset 0 0 0 4px rgba(197,160,89,.35), 0 16px 30px rgba(0,0,0,.6);
  }
  .plaque::before {
    content: ''; position: absolute; inset: 11px; pointer-events: none;
    background:
      radial-gradient(circle, #e8c98a 0 2px, #6b4e1f 3px, transparent 4.5px) 0 0 / 11px 11px no-repeat,
      radial-gradient(circle, #e8c98a 0 2px, #6b4e1f 3px, transparent 4.5px) 100% 0 / 11px 11px no-repeat,
      radial-gradient(circle, #e8c98a 0 2px, #6b4e1f 3px, transparent 4.5px) 0 100% / 11px 11px no-repeat,
      radial-gradient(circle, #e8c98a 0 2px, #6b4e1f 3px, transparent 4.5px) 100% 100% / 11px 11px no-repeat;
  }
  .sec-title { margin: 0; font-family: var(--f-caps); font-weight: 700; letter-spacing: .08em; font-size: clamp(1.9rem, 5vw, 2.7rem); line-height: 1.1; color: var(--parch); text-wrap: balance; text-shadow: 0 2px 0 rgba(0,0,0,.6); }
  .sec-sub { margin: 10px auto 0; max-width: 52ch; font-style: italic; color: rgba(232,216,176,.86); text-wrap: balance; }

  /* ---------- build-up reveal ---------- */
  .rv { position: relative; }
  .rv-hidden { opacity: 0; transform: translateY(-48px) scale(1.03); }
  .rv-build { animation: settle .95s cubic-bezier(.2,.9,.25,1) both; }
  @keyframes settle {
    0% { opacity: 0; transform: translateY(-48px) rotate(-.6deg) scale(1.03); }
    42% { opacity: 1; transform: translateY(0) rotate(0) scale(1); }
    52% { transform: translateY(6px) scaleY(.992); }
    64% { transform: translate(-3px, -2px); }
    74% { transform: translate(3px, 1px); }
    86% { transform: translate(-1.5px, 0); }
    100% { opacity: 1; transform: none; }
  }
  .smoke { position: absolute; left: 0; right: 0; bottom: 0; height: 0; pointer-events: none; z-index: 8; }
  .puff {
    position: absolute; bottom: -14px; left: var(--x); width: var(--s); height: var(--s); margin-left: calc(var(--s) / -2);
    border-radius: 50%; opacity: 0; filter: blur(7px);
    background: radial-gradient(circle at 40% 40%, rgba(196,193,188,.6), rgba(128,125,120,.3) 55%, transparent 72%);
    animation: puff 1.8s ease-out forwards;
  }
  @keyframes puff {
    0% { opacity: 0; transform: translate(0, 10px) scale(.3); }
    24% { opacity: .9; }
    100% { opacity: 0; transform: translate(var(--dx), -74px) scale(1.7); }
  }

  /* ---------- artifact cards ---------- */
  .frame {
    position: relative; height: 100%; padding: 12px; border-radius: 5px;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,0) 0 5px, rgba(0,0,0,.14) 5px 6px, rgba(255,200,140,.04) 6px 9px),
      linear-gradient(145deg, #5b3a22, #3a2314 45%, #4a2e1b 70%, #2b1810);
    box-shadow: inset 0 1px 0 rgba(255,214,160,.18), inset 0 -2px 4px rgba(0,0,0,.6), 0 12px 26px rgba(0,0,0,.55);
    transition: transform .35s cubic-bezier(.2,.8,.3,1), box-shadow .35s;
  }
  .frame:hover, .frame:focus-within {
    transform: translateY(-8px);
    box-shadow: inset 0 1px 0 rgba(255,214,160,.32), inset 0 0 0 1px rgba(255,170,51,.55), 0 0 0 1px rgba(197,160,89,.6), 0 0 36px 4px rgba(255,170,51,.4), 0 22px 34px rgba(0,0,0,.6);
  }
  .frame .inner {
    position: relative; height: 100%; display: flex; flex-direction: column; background: var(--bog);
    box-shadow: 0 0 0 2px #0d0705, 0 0 0 3px rgba(197,160,89,.3);
  }
  .corner { position: absolute; width: 30px; height: 30px; z-index: 3; pointer-events: none; filter: drop-shadow(0 1px 1px rgba(0,0,0,.7)); }
  .corner svg { display: block; width: 100%; height: 100%; }
  .corner.tl { top: -2px; left: -2px; }
  .corner.tr { top: -2px; right: -2px; transform: scaleX(-1); }
  .corner.bl { bottom: -2px; left: -2px; transform: scaleY(-1); }
  .corner.br { bottom: -2px; right: -2px; transform: scale(-1, -1); }
  .plate {
    position: relative; aspect-ratio: 5 / 4; display: grid; place-items: center; border-bottom: 2px solid #0d0705;
    background:
      radial-gradient(circle at 50% 44%, rgba(255,170,51,.24), transparent 62%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.016) 0 2px, transparent 2px 5px),
      #130b07;
  }
  .plate .icon { width: 56%; max-width: 190px; transition: transform .4s cubic-bezier(.2,.8,.3,1); }
  .frame:hover .plate .icon { transform: scale(1.06) rotate(-1.5deg); }
  .icon svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 6px 10px rgba(0,0,0,.65)); }
  .lot { position: absolute; left: 14px; top: 10px; font-family: var(--f-caps); letter-spacing: .14em; font-size: .85rem; color: var(--bronze); }
  .body { flex: 1; display: flex; flex-direction: column; padding: 16px 18px 18px; min-width: 0; }
  .body h3 { margin: 0; font-family: var(--f-caps); font-weight: 700; letter-spacing: .05em; font-size: 1.4rem; line-height: 1.15; color: var(--parch); text-wrap: balance; }
  .body .en { margin: 3px 0 0; font-style: italic; color: var(--steel-lt); }
  .body .prov { margin: 6px 0 0; font-family: var(--f-caps); letter-spacing: .1em; font-size: .8rem; color: var(--bronze); }
  .body .desc { margin: 12px 0 0; color: rgba(232,216,176,.86); }
  .buy { margin-top: auto; padding-top: 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  .price { display: inline-flex; align-items: center; gap: 7px; font-family: var(--f-caps); font-weight: 700; font-size: 1.55rem; color: var(--bronze); font-variant-numeric: oldstyle-nums; white-space: nowrap; }
  .price abbr { text-decoration: none; font-size: .9rem; letter-spacing: .1em; color: rgba(197,160,89,.85); }
  .coin { width: 20px; height: 20px; }

  .icon .swing { animation: swing 4.5s ease-in-out infinite; }
  .icon .roll { animation: roll 5s ease-in-out infinite; }
  .icon .halo { animation: halo 5s ease-in-out infinite; transform-origin: 60px 72px; }
  .icon .script { stroke-dasharray: 100; animation: write 6s ease-in-out infinite; }
  .icon .twinkle { animation: twinkle 3.2s ease-in-out infinite; }
  @keyframes swing { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  @keyframes roll { 0%, 100% { transform: translate(-4px, .5px); } 50% { transform: translate(4px, -.5px); } }
  @keyframes halo { 0%, 100% { opacity: .6; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.05); } }
  @keyframes write { 0% { stroke-dashoffset: 100; opacity: 1; } 55% { stroke-dashoffset: 0; opacity: 1; } 85% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
  @keyframes twinkle { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

  /* ---------- statute wall (timber frame) ---------- */
  .wall {
    position: relative; padding: clamp(36px, 5vw, 60px) clamp(30px, 5vw, 60px);
    background:
      radial-gradient(rgba(232,216,176,.04) 1px, transparent 1.6px) 0 0 / 8px 8px,
      linear-gradient(180deg, #2a1710, #1f120b);
    box-shadow: inset 0 0 0 12px var(--oak), inset 0 0 0 14px var(--bog), inset 0 0 0 15px rgba(197,160,89,.28), 0 22px 44px rgba(0,0,0,.6);
  }
  .wall::before, .wall::after { content: ''; position: absolute; top: 14px; width: 96px; height: 96px; pointer-events: none; }
  .wall::before { left: 14px; background: linear-gradient(135deg, transparent 0 41%, var(--oak) 41% 59%, transparent 59%); }
  .wall::after { right: 14px; background: linear-gradient(225deg, transparent 0 41%, var(--oak) 41% 59%, transparent 59%); }
  .statute h3 { margin: 12px 0 6px; font-family: var(--f-caps); letter-spacing: .1em; font-size: 1.25rem; color: var(--bronze); }
  .statute p { margin: 0; color: rgba(232,216,176,.88); }
  .statute .glyph { width: 40px; height: 40px; }
  .statute .glyph svg { display: block; width: 100%; height: 100%; }
  .statute > div { border-top: 3px solid var(--oak); padding-top: 16px; }

  /* ---------- footer ---------- */
  .foot { position: relative; margin-top: 90px; background: linear-gradient(180deg, #24140c, #120a06); border-top: 3px solid var(--ink); box-shadow: 0 -1px 0 rgba(197,160,89,.4), 0 -16px 30px rgba(0,0,0,.5); }
  .foot-in { display: flex; align-items: flex-start; justify-content: center; gap: clamp(18px, 6vw, 70px); padding-top: 34px; padding-bottom: max(40px, env(safe-area-inset-bottom, 0px)); text-align: center; }
  .foot-name { font-family: var(--f-display); font-size: 2.6rem; line-height: 1; margin: 0; color: var(--parch); text-shadow: 0 0 18px rgba(255,170,51,.3); }
  .foot-lines { margin: 10px 0 0; color: rgba(232,216,176,.8); }
  .foot-lines span { display: block; }
  .foot small { display: block; margin-top: 14px; color: rgba(169,182,194,.75); letter-spacing: .04em; }
  .torch { position: relative; flex: none; width: 27px; height: 130px; margin-top: 6px; }

  /* rain: a canvas of slanted drops with small splashes at street level */
  function Rain() {
    var ref = useRef(null);
    useEffect(function () {
      var c = ref.current, ctx = c.getContext('2d');
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var w = 0, h = 0, drops = [], splashes = [], raf = 0, visible = true, slant = 0.22;
      function make(init) {
        return { x: Math.random() * (w + h * slant + 40), y: init ? Math.random() * h : -24, l: 10 + Math.random() * 16, v: 13 + Math.random() * 12, a: 0.16 + Math.random() * 0.32 };
      }
      function resize() {
        var r = c.parentElement.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = r.width; h = r.height;
        c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        var n = Math.round(Math.min(280, (w * h) / 5200));
        drops = []; for (var i = 0; i < n; i++) drops.push(make(true));
        if (reduce) draw(false);
      }
      function draw(step) {
        ctx.clearRect(0, 0, w, h);
        ctx.lineWidth = 1.1; ctx.lineCap = 'round';
        for (var i = 0; i < drops.length; i++) {
          var d = drops[i];
          ctx.strokeStyle = 'rgba(205,214,226,' + d.a + ')';
          ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.l * slant, d.y + d.l); ctx.stroke();
          if (!step) continue;
          d.x -= d.v * slant; d.y += d.v;
          if (d.y > h) {
            if (Math.random() < 0.16) splashes.push({ x: d.x, y: h - 34 - Math.random() * 26, r: 1, a: 0.5 });
            drops[i] = make(false);
          }
        }
        for (var j = splashes.length - 1; j >= 0; j--) {
          var s = splashes[j];
          ctx.strokeStyle = 'rgba(205,214,226,' + s.a + ')';
          ctx.beginPath(); ctx.ellipse(s.x, s.y, s.r * 2.2, s.r * 0.8, 0, 0, Math.PI * 2); ctx.stroke();
          s.r += 0.55; s.a -= 0.035;
          if (s.a <= 0) splashes.splice(j, 1);

      if (io) io.observe(c);
      if (!reduce) raf = requestAnimationFrame(loop);
      return function () { cancelAnimationFrame(raf); if (ro) ro.disconnect(); else window.removeEventListener('resize', resize); if (io) io.disconnect(); };
    }, []);

  }

  function Clouds() {

    return html`<div className="smoke" aria-hidden="true">${puffs.map(function (p, i) {

    })}</div>`;

  /* "Construction" reveal: hidden below the fold, then drops into place with a shake and a dust cloud */
  function Reveal(props) {
    var ref = useRef(null);
    var st = useState('visible'), state = st[0], setState = st[1];
    var delay = props.delay || 0;
    useLayoutEffect(function () {
      var el = ref.current;
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!el || reduce || !('IntersectionObserver' in window)) return;
      if (el.getBoundingClientRect().top < window.innerHeight * 0.9) return;
      setState('hidden');
      var t;
      var io = new IntersectionObserver(function (entries) {
        if (entries[0].isIntersecting) {
          io.disconnect();
          setState('building');

        }
      }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
      io.observe(el);
      return function () { io.disconnect(); clearTimeout(t); };
    }, []);
    var cls = 'rv ' + (props.className || '') + (state === 'hidden' ? ' rv-hidden' : '') + (state === 'building' ? ' rv-build' : '');
